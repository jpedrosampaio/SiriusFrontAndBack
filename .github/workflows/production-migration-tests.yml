name: Production migration safety tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sirius_test
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: sirius_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sirius_test -d sirius_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements-production-migrations.txt PyYAML==6.0.3
      - name: Reject unsafe PRs and prove locking, version gates, retry and rollback
        env:
          RUN_MIGRATION_TESTS: 'true'
          MIGRATION_TEST_DATABASE_URL: postgresql://sirius_test:test-only@127.0.0.1:5432/sirius_test
        run: python -m unittest discover -s tests -p test_production_migrations.py -v
