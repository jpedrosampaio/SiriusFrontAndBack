name: PostgreSQL persistence
on:
  push:
    branches: [main, feat/postgres-neon]
  pull_request:
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: sirius_test
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: sirius_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sirius_test -d sirius_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://sirius_test:test-only@localhost:5432/sirius_test
      RUN_POSTGRES_TESTS: 'true'
      RUN_NEON_LIVE_TESTS: 'false'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Build schema from empty PostgreSQL
        run: python -m alembic upgrade head
      - name: Verify model and migration agree
        run: python -m alembic check
      - name: Real persistence, ownership, money and transactions
        run: python -m unittest discover -s tests -p 'test_postgres_*.py' -v
