name: Backend and browser regression tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  security-routes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install fastapi==0.110.1 pydantic==2.12.5 httpx==0.28.1 requests==2.32.5
      - name: Check backend syntax
        run: python -m compileall -q backend
      - name: Test isolated security routes (no live services)
        run: python -m unittest discover -s backend/tests -p 'test_*regression.py' -v
      - name: Security routes
        run: python -m unittest discover -s backend/tests -p test_security_routes.py -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Service worker regression tests
        run: node --test frontend/tests/service-worker.test.cjs

  xp-concurrency:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      XP_TEST_MONGO_URI: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install fastapi==0.110.1 pydantic==2.12.5 motor==3.3.1 pymongo==4.5.0
      - name: XP tests against disposable MongoDB
        run: python -m unittest discover -s backend/tests -p test_xp_regression.py -v
