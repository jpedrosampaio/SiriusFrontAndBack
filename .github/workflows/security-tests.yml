name: Security regression tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  security-routes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install fastapi==0.110.1 pydantic==2.12.5 httpx==0.28.1
      - name: Check backend syntax
        run: python -m compileall -q backend
      - name: Test isolated security routes (no live services)
        run: python -m unittest discover -s backend/tests -p test_security_routes.py -v
