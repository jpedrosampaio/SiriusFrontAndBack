name: Production migrations

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR aprovada no registro da main (exemplo: 30)'
        required: true
        type: string

permissions: {}

concurrency:
  group: sirius-production-migrations
  cancel-in-progress: false

jobs:
  preflight:
    if: github.ref == 'refs/heads/main' && github.repository == 'jpedrosampaio/SiriusFrontAndBack'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify immutable approval, exact-head CI and migration bytes (no database)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: python tools/production_migrations.py --pr "$PR_NUMBER"

  migrate:
    needs: preflight
    if: github.ref == 'refs/heads/main' && github.repository == 'jpedrosampaio/SiriusFrontAndBack'
    environment: production-migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install only trusted migration dependencies
        run: python -m pip install -r tools/requirements-production-migrations.txt
      - name: Revalidate after environment approval (still no database)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: python tools/production_migrations.py --pr "$PR_NUMBER"
      - name: Lock database, verify parent, upgrade approved revision and verify result
        env:
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: python tools/production_migrations.py --pr "$PR_NUMBER" --apply
