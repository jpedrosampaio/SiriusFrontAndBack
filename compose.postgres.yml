services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: sirius_dev
      POSTGRES_USER: sirius_dev
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - sirius_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sirius_dev -d sirius_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  sirius_postgres:
